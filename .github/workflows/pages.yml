name: Deploy versioned previews to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate the frozen R14 version
        run: |
          node versions/r14/test-performance.mjs
          node versions/r14/test-interaction.mjs
          node versions/r14/test-mobile-viewport.mjs
          node versions/r14/test-recording-score.mjs
          node versions/r14/test-workspace.mjs
      - name: Validate the seven-bell R15 version
        run: |
          node versions/r15/test-paired-instrument.mjs
          node versions/r15/test-performance.mjs
          node versions/r15/test-interaction.mjs
          node versions/r15/test-mobile-viewport.mjs
          node versions/r15/test-recording-score.mjs
          node versions/r15/test-workspace.mjs
      - name: Build the allowlisted static site
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
